<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="80%"><stop offset="0" stop-color="#101b2b"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#03060a"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9" stop-opacity=".8"/><stop offset="1" stop-color="#637cff" stop-opacity=".2"/></linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <style>
      .connector{fill:none;stroke:url(#line);stroke-width:1.4;stroke-opacity:.58}
      .node{fill:#09121f;stroke:#66d9f5;stroke-width:1.4}
      .dot{fill:#9af3ff;filter:url(#glow)}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;fill:#d8e7f7;letter-spacing:1.3px}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;fill:#71849d;letter-spacing:3px}
      .category{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;fill:#65dff5;letter-spacing:2.5px}
      .centerTitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:29px;font-weight:700;fill:#f0f7ff;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <circle cx="600" cy="365" r="250" fill="#167bbd" opacity=".07" filter="url(#soft)"/>
  <!-- subtle star field -->
  <g fill="#a8c8e8" opacity=".45">
    <circle cx="86" cy="112" r="1.3"/><circle cx="181" cy="229" r="1"/><circle cx="309" cy="82" r="1.4"/><circle cx="440" cy="149" r="1"/><circle cx="1010" cy="121" r="1.5"/><circle cx="1110" cy="238" r="1"/><circle cx="1048" cy="580" r="1.4"/><circle cx="865" cy="662" r="1"/><circle cx="186" cy="602" r="1.2"/><circle cx="77" cy="508" r="1"/><circle cx="724" cy="95" r="1.2"/><circle cx="1162" cy="461" r="1.2"/><circle cx="325" cy="693" r="1.1"/><circle cx="503" cy="583" r="1"/><circle cx="925" cy="310" r="1.2"/><circle cx="246" cy="392" r="1"/><circle cx="110" cy="335" r="1.4"/><circle cx="770" cy="540" r="1.1"/><circle cx="1002" cy="690" r="1"/><circle cx="550" cy="38" r="1.2"/><circle cx="640" cy="712" r="1.1"/>
  </g>
  <!-- connections -->
  <g class="connector">
    <path d="M600 365 L350 205 L200 150 M350 205 L190 285 M350 205 L360 95"/>
    <path d="M600 365 L865 195 L1035 145 M865 195 L1050 285 M865 195 L900 80"/>
    <path d="M600 365 L900 485 L1050 560 M900 485 L1010 660 M900 485 L770 670"/>
    <path d="M600 365 L350 520 L180 600 M350 520 L240 690 M350 520 L80 470"/>
    <path d="M600 365 L600 610 L500 690 M600 610 L690 700"/>
  </g>
  <!-- constellation category anchors -->
  <g filter="url(#glow)"><circle class="dot" cx="350" cy="205" r="4"/><circle class="dot" cx="865" cy="195" r="4"/><circle class="dot" cx="900" cy="485" r="4"/><circle class="dot" cx="350" cy="520" r="4"/><circle class="dot" cx="600" cy="610" r="4"/></g>
  <!-- Center identity card -->
  <rect x="405" y="303" width="390" height="124" rx="24" fill="#42c9f2" opacity=".08" filter="url(#soft)"/>
  <rect x="420" y="315" width="360" height="100" rx="22" fill="#0b1624" stroke="#68e3f6" stroke-opacity=".78" stroke-width="1.7"/>
  <rect x="432" y="327" width="336" height="76" rx="16" fill="none" stroke="#6b8bff" stroke-opacity=".24" stroke-dasharray="2 7"/>
  <text x="600" y="365" text-anchor="middle" class="centerTitle" style="font-size:25px;letter-spacing:1.4px">SABYASACHI MISHRA</text>
  <text x="600" y="390" text-anchor="middle" class="sub">DEVELOPER NODE</text>
  <!-- AI/ML group -->
  <circle class="node" cx="350" cy="205" r="31"/><text x="350" y="210" text-anchor="middle" class="category">AI / ML</text>
  <text class="label" x="200" y="150">Python</text><circle class="dot" cx="190" cy="145" r="3"/>
  <text class="label" x="178" y="285">TensorFlow</text><circle class="dot" cx="170" cy="280" r="3"/>
  <text class="label" x="360" y="85">Scikit-learn</text><circle class="dot" cx="360" cy="95" r="3"/>
  <!-- Full stack -->
  <circle class="node" cx="865" cy="195" r="31"/><text x="865" y="200" text-anchor="middle" class="category">WEB</text>
  <text class="label" x="1035" y="145">React</text><circle class="dot" cx="1035" cy="140" r="3"/>
  <text class="label" x="1050" y="285">Next.js</text><circle class="dot" cx="1045" cy="280" r="3"/>
  <text class="label" x="900" y="75">TypeScript</text><circle class="dot" cx="900" cy="80" r="3"/>
  <!-- Backend -->
  <circle class="node" cx="900" cy="485" r="31"/><text x="900" y="490" text-anchor="middle" class="category">API</text>
  <text class="label" x="1050" y="560">Node.js</text><circle class="dot" cx="1050" cy="555" r="3"/>
  <text class="label" x="1010" y="660">Express</text><circle class="dot" cx="1010" cy="655" r="3"/>
  <text class="label" x="770" y="675">FastAPI</text><circle class="dot" cx="770" cy="670" r="3"/>
  <!-- Systems -->
  <circle class="node" cx="350" cy="520" r="31"/><text x="350" y="525" text-anchor="middle" class="category">CORE</text>
  <text class="label" x="180" y="600">C++</text><circle class="dot" cx="180" cy="595" r="3"/>
  <text class="label" x="240" y="690">Java</text><circle class="dot" cx="240" cy="685" r="3"/>
  <text class="label" x="80" y="470">Linux</text><circle class="dot" cx="80" cy="465" r="3"/>
  <!-- Data -->
  <circle class="node" cx="600" cy="610" r="31"/><text x="600" y="615" text-anchor="middle" class="category">DATA</text>
  <text class="label" x="500" y="695">SQL</text><circle class="dot" cx="500" cy="690" r="3"/>
  <text class="label" x="690" y="705">MongoDB</text><circle class="dot" cx="690" cy="700" r="3"/>
  <!-- Header and footer -->
  <text x="54" y="48" class="sub">PERSONAL TECHNOLOGY MAP / 2026</text>
  <text x="1146" y="48" text-anchor="end" class="sub">SYSTEMS IN PROGRESS</text>
  <path d="M54 66 H1146" stroke="#233243" stroke-width="1"/>
  <path d="M54 715 H1146" stroke="#233243" stroke-width="1"/>
  <text x="54" y="742" class="sub">LEARN / BUILD / ITERATE</text>
  <text x="1146" y="742" text-anchor="end" class="sub">GITHUB.COM/SABYASACHI100</text>
</svg>

